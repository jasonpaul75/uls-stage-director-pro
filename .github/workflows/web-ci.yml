name: Web CI

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: "ci_ci_ci_ci_ci_ci_ci_ci_ci_ci_ci_ci_ci_ci"
      # Service port is forwarded to the runner VM; use localhost — `postgres` only resolves inside a job container network.
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/stage_director_ci?schema=public"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stage_director_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 runner warnings in Actions; Node 22 is current LTS and matches modern Next toolchain.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate (schema for build/tests)
        run: npx prisma migrate deploy && npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e -- e2e/
